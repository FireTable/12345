# docker compose for 民声智理 · 12345 AI 智能研判系统 (多城市 / 多租户 V2 生产架构)
# ============================================================
# 改动 vs 原版 (老大确认的方案):
#   - 删除 caddy service (复用 langgraph-app-caddy-1)
#   - 删除 postgres host port (用 stack 内网, 不占 host 端口)
#   - app service 改名为 ticket-radar-app (避免跟 langgraph-app 的 `app` DNS 冲突)
#   - 加入 external network langgraph-app_default (让 caddy 能解析)
#
# 部署命令 (VPS 上, 必须用 --env-file 让 ${POSTGRES_PASSWORD} 能插值):
#   cd /opt/12345-stack
#   docker compose --env-file .env.vps up -d
#   docker compose --env-file .env.vps logs -f ticket-radar-app
#
# 首次部署 checklist (详见 DEPLOY.md):
#   1. rsync 代码到 VPS /opt/12345-stack/
#   2. cp .env.vps.example .env.vps && 编辑填入密钥
#   3. ssh root@VPS 'cd /opt/12345-stack && docker compose --env-file .env.vps up -d --build'
#   4. Caddyfile 加 vhost: <your-domain> → ticket-radar-app:3100
#   5. docker exec langgraph-app-caddy-1 caddy reload --config /etc/caddy/Caddyfile
#
# 独立域名启动电商售后客诉站（同镜像双实例，Caddy 按子域分流）：
#   - https://12345.firetable.tech → 12345-app:3100     (APP_DOMAIN=GOV_12345)
#   - https://ecom.firetable.tech  → 12345-ecom-app:3100 (APP_DOMAIN=ECOMMERCE_CS)
# ============================================================

services:
  postgres:
    # Postgres 16 + pgvector。沿用名为 pgdata 的卷，不删数据；扩展在现有库里 CREATE EXTENSION。
    image: pgvector/pgvector:pg16
    container_name: 12345-postgres
    restart: unless-stopped
    shm_size: 512m
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ticket_radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default

  app:
    # Service renamed: ticket-radar-app (避免 DNS clash with langgraph-app 的 `app`)
    image: ticket-radar:v0.1.20
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 12345-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ticket_radar
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
      APP_DOMAIN: GOV_12345
      BETTER_AUTH_URL: https://12345.firetable.tech
      BETTER_AUTH_TRUSTED_ORIGINS: https://12345.firetable.tech
      CIVIC_SKIP_BOOTSTRAP: "1"
    # 远程部署从 .env.vps 注入 OPENAI_* / EMBEDDING_* / RERANK_*
    env_file:
      - .env.vps
    expose:
      - "3100"
    # No host port mapping — caddy reaches 12345-app:3100 via langgraph-app_default
    networks:
      - default
      - langgraph-app_default

  ecom-app:
    # 复用同一生产镜像，独立运行电商售后客诉域 (https://ecom.firetable.tech)
    image: ticket-radar:v0.1.20
    container_name: 12345-ecom-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ticket_radar
      NODE_ENV: production
      PORT: 3100
      HOSTNAME: 0.0.0.0
      APP_DOMAIN: ECOMMERCE_CS
      BETTER_AUTH_URL: https://ecom.firetable.tech
      BETTER_AUTH_TRUSTED_ORIGINS: https://ecom.firetable.tech
      CIVIC_SKIP_BOOTSTRAP: "1"
    env_file:
      - .env.vps
    expose:
      - "3100"
    networks:
      - default
      - langgraph-app_default

volumes:
  pgdata:

networks:
  default:
    name: 12345_default
  langgraph-app_default:
    external: true