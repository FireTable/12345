<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="civic-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="inner-grad" x1="8" y1="8" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#civic-grad)" />
  <!-- Dynamic Audio Soundwave / Civic Signal Waves -->
  <rect x="7" y="13" width="2.5" height="6" rx="1.25" fill="#BAE6FD" />
  <rect x="11" y="9" width="2.5" height="14" rx="1.25" fill="#FFFFFF" />
  <rect x="15" y="6" width="2.5" height="20" rx="1.25" fill="#FFFFFF" />
  <rect x="19" y="10" width="2.5" height="12" rx="1.25" fill="#FFFFFF" />
  <rect x="23" y="13" width="2.5" height="6" rx="1.25" fill="#BAE6FD" />
  <!-- AI Sparkle Indicator Dot -->
  <circle cx="24" cy="7" r="2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
</svg>
