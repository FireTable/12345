<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 540"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="map-title map-description">
  <title id="map-title">佛山市顺德区十镇街地图</title>
  <desc id="map-description">包含陈村、北滘、乐从、龙江、伦教、大良、容桂、勒流、杏坛、均安十个可交互镇街区域。</desc>

  <style>
    .region {
      cursor: pointer;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      transition: filter 160ms ease, opacity 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }

    .region:hover,
    .region:focus,
    .region.is-hovered {
      filter: brightness(1.05) saturate(1.1);
      stroke: #1E5AFF;
      stroke-width: 4;
      stroke-linejoin: round;
      stroke-linecap: round;
      outline: none;
    }

    .region.is-selected {
      stroke: #0F172A !important;
      stroke-width: 4.5 !important;
      filter: brightness(1.08) drop-shadow(0 2px 8px rgba(0,0,0,0.25));
    }

    .region-label {
      pointer-events: none;
      fill: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke fill;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linejoin: round;
    }

    .region-label--inverse {
      fill: #ffffff;
      stroke: #1E3A8A;
      stroke-width: 3.5;
    }
  </style>

