<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- 外层基底渐变：深邃政务蓝到科技蔚蓝 -->
    <linearGradient id="civicBaseGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 顶部高光微边缘渐变 -->
    <linearGradient id="rimGrad" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1" />
    </linearGradient>

    <!-- 声纹柱核心纯净白渐变 -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- 雷达脉冲与神经环渐变 -->
    <linearGradient id="orbitGrad" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- 柔和立体阴影 -->
    <filter id="civicShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.32" />
    </filter>

    <!-- 灵动微发光滤镜 -->
    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 外层圆角矩形盾形底座 (Squircle) -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#civicBaseGrad)" filter="url(#civicShadow)" />
  <rect x="9" y="9" width="110" height="110" rx="29" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- 背景轻量科技雷达回响环 (Radar Ripples) -->
  <circle cx="64" cy="64" r="44" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="3 4" stroke-opacity="0.18" />
  <circle cx="64" cy="64" r="30" stroke="#BAE6FD" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.22" />

  <!-- 12345 五位一体数字民声声纹 (1-2-3-4-5 音频律动波形) -->
  <g id="civicBars" filter="url(#glowLight)">
    <!-- 1: 诉求接入 (左侧基线) -->
    <rect x="28" y="52" width="7" height="24" rx="3.5" fill="#BAE6FD" fill-opacity="0.9" />

    <!-- 2: 快思考分流 (次高) -->
    <rect x="42" y="38" width="7" height="52" rx="3.5" fill="url(#barGrad)" />

    <!-- 3: 认知中枢核心 (中心主峰 12345 峰值) -->
    <rect x="56" y="26" width="8" height="76" rx="4" fill="#FFFFFF" />

    <!-- 4: 时空聚类研判 (次高) -->
    <rect x="71" y="42" width="7" height="44" rx="3.5" fill="url(#barGrad)" />

    <!-- 5: 治理闭环狙击 (右侧基线) -->
    <rect x="85" y="52" width="7" height="24" rx="3.5" fill="#BAE6FD" fill-opacity="0.9" />
  </g>

  <!-- 认知中枢 AI 智理神经星环 (跨越波峰的认知拓扑连接) -->
  <path d="M28 64 C44 48, 84 48, 100 64" stroke="url(#orbitGrad)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.85" />

  <!-- 核心 AI 认知星芒点 (智能中枢指示) -->
  <g filter="url(#glowLight)">
    <circle cx="94" cy="28" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" />
    <polygon points="94,21 95.8,26.2 101,28 95.8,29.8 94,35 92.2,29.8 87,28 92.2,26.2" fill="#FFFFFF" />
  </g>

  <!-- 底部微光质感 -->
  <circle cx="64" cy="112" r="1.5" fill="#BAE6FD" opacity="0.5" />
</svg>
